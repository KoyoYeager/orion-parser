[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion-parser"
version = "0.1.0"
description = "Multi-language source code analysis engine — extract structure, call trees, and data flow from code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "KoyoYeager" },
]
keywords = ["parser", "ast", "static-analysis", "lexer", "ply", "source-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "ply>=3.11",
    "rich>=13.0",
    "chardet>=5.0",
]

[project.optional-dependencies]
analysis = ["networkx>=3.0", "matplotlib>=3.8"]
gui = ["PySide6>=6.6", "networkx>=3.0", "pytest-qt>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = ["orion-parser[analysis,gui,dev]"]

[project.scripts]
orion-parser = "orionparser.cli:main"

[project.urls]
Homepage = "https://github.com/KoyoYeager/orion-parser"
Repository = "https://github.com/KoyoYeager/orion-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/orionparser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
