<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>Call Tree</title>
<style>
body { font-family: Consolas, monospace; margin: 20px; background: #FAFAFA; }
h1 { color: #0078D4; font-size: 20px; }
.canvas { position: relative; min-height: 580px; border: 1px solid #DDD; background: #FFF; }
.node { position: absolute; padding: 8px 16px; border: 1.5px solid #3C3C3C;
         border-radius: 6px; font-size: 13px; cursor: pointer; color: #1E1E1E; }
.node:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.stats { margin-top: 16px; color: #666; font-size: 12px; }
svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
</style></head><body>
<h1>OrionParser — Call Tree</h1>
<p class="stats">ノード: 6 | エッジ: 5</p>

<div class="node" style="background:#85C1E9;top:200px;left:200px;" data-id="parse_file">parse_file</div>
<div class="node" style="background:#85C1E9;top:280px;left:200px;" data-id="validate">validate</div>
<div class="node" style="background:#85C1E9;top:360px;left:200px;" data-id="read_tokens">read_tokens</div>
<div class="node" style="background:#D7BDE2;top:440px;left:200px;" data-id="Config.__init__">Config.__init__</div>
</div>
